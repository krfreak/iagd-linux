# Builds the AppImage and publishes it as a GitHub release.
#
# Push a tag to release:  git tag v2026.08.17 && git push origin v2026.08.17
# Or run it by hand from the Actions tab, which builds the same artifacts without releasing.
#
# The build is the one in the Makefile, not a re-implementation of it: this assembles the
# toolchains the hook, the injector and the .NET app need, and then runs the Makefile's own
# targets. If a release and a local `make package` ever disagree, the difference is in what is
# installed below and nowhere else.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04

    env:
      # GitHub runners have no FUSE, so appimagetool — itself an AppImage — cannot mount itself.
      # This makes it unpack and run instead, which is the supported way to use it in CI.
      APPIMAGE_EXTRACT_AND_RUN: 1
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - name: Check out, with the pinned submodules
        uses: actions/checkout@v7
        with:
          # scripts/prepare.sh unpacks the hook and the injector from these, and
          # packaging/make-icon.sh takes the application icon out of upstream's gd.ico. Their
          # history has to come with them: prepare.sh reads the pinned commit via `git archive`.
          submodules: recursive
          fetch-depth: 0

      - name: Install the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pil desktop-file-utils file zsync
        # python3-pil lets make-icon.sh extract upstream's icon rather than falling back to the
        # drawn one. desktop-file-utils, file and zsync are what appimagetool shells out to.
        # The mingw toolchain is deliberately absent — see the native build step.

      - name: Install appimagetool
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo install -m755 appimagetool /usr/local/bin/appimagetool
          rm appimagetool
          appimagetool --version

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linux-port/src/WebUI/package-lock.json

      # The generation prefix exists to be bumped. A cache saved from a run whose restore was
      # interrupted is restored by every later run through restore-keys, and no replacement is
      # ever saved while the primary key keeps missing — so a half-written packages folder
      # repeats the same failure forever. Bumping it is how that loop is broken; nothing else
      # here reads the number.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget2-${{ runner.os }}-${{ hashFiles('linux-port/**/*.csproj') }}
          restore-keys: nuget2-${{ runner.os }}-

      # A tag names the build; a manual run falls back to the script's own date-based version.
      - name: Decide the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Unpack the patched hook and injector sources
        run: scripts/prepare.sh

      # ── Why the two Windows binaries are built in a container ───────────────────────────────
      #
      # Ubuntu's mingw-w64 targets msvcrt.dll. The hook that was measured loading cleanly inside
      # the live game (PHASE0.md §9) is a UCRT build, which is what the toolchain used for
      # development produces, and Ubuntu packages no UCRT variant to switch to. Rather than ship
      # a hook nobody has run under Proton, the two mingw builds happen in an Arch container —
      # the same compiler and the same CRT as the local build. Measured here: 12 api-ms-win-crt
      # imports and no msvcrt.dll, against 0 and one respectively under Ubuntu's toolchain.
      #
      # Only these two steps need it. Everything else — .NET, node, appimagetool — runs on the
      # runner as usual.
      - name: Build the hook and the injector
        run: |
          docker run --rm -v "$PWD":/w -w /w archlinux:latest bash -euc '
            pacman -Sy --noconfirm --needed make mingw-w64-gcc
            make -C linux-port/native/hook
            make -C build/proton-injector
            # The whole reason the hook is rebuilt rather than taken from upstream'"'"'s binary.
            # A release that reintroduced the MSVC C++ runtime imports would fail to initialise
            # under Proton on someone else'"'"'s machine rather than here.
            make -C linux-port/native/hook deps
            chown -R '"$(id -u):$(id -g)"' linux-port/native/hook build
          '

      # linux-port/package rather than the root `package`, whose `native` prerequisite would want
      # a mingw compiler on the runner. build-appimage.sh checks both binaries are present and
      # stops with a clear message if the step above did not produce them.
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make -C linux-port package

      - name: List what was built
        run: ls -lh linux-port/packaging/out

      - uses: actions/upload-artifact@v7
        with:
          name: iagd-${{ steps.version.outputs.version }}-x86_64
          path: |
            linux-port/packaging/out/*.AppImage
            linux-port/packaging/out/*.tar.gz
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd linux-port/packaging/out
          sha256sum *.AppImage *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --title "Item Assistant for Grim Dawn $VERSION" \
            --notes-file - \
            "iagd-$VERSION-x86_64.AppImage" \
            "iagd-$VERSION-linux-x64.tar.gz" \
            SHA256SUMS <<'NOTES'
          A self-contained build of the Linux port. Nothing else to install — the .NET runtime
          travels with it — with one exception the app checks for and reports:

          **WebKitGTK 4.1 must be installed on the host.** It is tied to the system graphics
          stack, so bundling it is not realistic.

              Debian/Ubuntu  libwebkit2gtk-4.1-0
              Arch           webkit2gtk-4.1
              Fedora         webkit2gtk4.1

          ```
          chmod +x iagd-*-x86_64.AppImage
          ./iagd-*-x86_64.AppImage
          ```

          The tarball is the same package unpacked, for anyone who would rather not run an
          AppImage: extract it and run `iagd.AppDir/AppRun`. The headless host
          (`usr/bin/iagd-host`) needs no WebKitGTK at all.
          NOTES
